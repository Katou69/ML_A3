name: CI/CD

# run on every push (and on pull requests)
on:
  push:
  pull_request:

jobs:
  # ---------- CI: run the unit tests ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # same as the Dockerfile

      - name: Install dependencies
        run: pip install -r app/code/requirements.txt pytest

      - name: Run unit tests
        run: pytest -v

  # ---------- CD: build + push the Docker image (only if tests passed) ----------
  deploy:
    needs: test                           # skipped automatically if the tests fail
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app                    # folder that contains the Dockerfile and code/
          push: true
          tags: minthantwin/car-price-app:a3
